<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mening shitim simulyatori</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1f1e1b;--tx2:#6b6a65;--bd:#d3d1c7;--ac:#185FA5;--ok:#3B6D11;--er:#A32D2D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#1c1c1a;--sf:#2a2a27;--tx:#f1efe8;--tx2:#aaa89f;--bd:#4a4944;--ac:#85B7EB;--ok:#97C459;--er:#F09595;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:680px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:14px}
#chip{font-size:12px;color:var(--tx2)}
#sv{flex:1;min-height:0;padding:0 6px}
#sv svg{width:100%;height:100%;display:block}
#tk{padding:4px 12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-top:1px solid var(--bd)}
nav{display:flex;border-top:1px solid var(--bd)}
nav button{flex:1;border:0;border-radius:0;background:transparent;min-height:36px;font-size:14px}
nav button.on{border-bottom:2px solid var(--ac);color:var(--ac)}
section{height:128px;overflow:auto;padding:6px 10px;background:var(--sf)}
button,input[type=text]{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;min-height:36px;font-size:14px}
button{cursor:pointer}
button.on{border-color:var(--ac);outline:2px solid var(--ac)}
button.d{border-color:var(--er);color:var(--er)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center}
ul{margin:0;padding-left:18px;font-size:13px}
li{margin:2px 0}
.bad{color:var(--er)}
.good{color:var(--ok)}
.lb{font-size:7px;fill:#555}
.tg{cursor:pointer}
svg text{font-family:system-ui,sans-serif}
[hidden]{display:none!important}
</style></head><body>
<div id="app">
<header><b>Mening shitim simulyatori</b><span id="chip"></span></header>
<div id="sv"></div>
<div id="tk"></div>
<nav><button data-t="1" class="on">Ulash</button><button data-t="2">Sinov</button><button data-t="3">Holat</button></nav>
<section id="p1"><div class="row" id="cb"></div>
<div class="row"><button id="un">Orqaga</button><button id="cl">Tozalash</button><button id="ck">Tekshirish</button></div>
<div class="row"><button id="ok1">To‘g‘ri sxema</button><button id="by1" class="d">Relesiz (xato)</button></div></section>
<section id="p2" hidden><div class="row"><span>Tarmoq: <b id="vv">220</b> V</span><input type="range" id="vr" min="120" max="300" value="220" style="flex:1;min-width:120px"></div>
<div class="row"><input type="text" id="rn" aria-label="Guruh nomi" placeholder="Guruh nomi" style="flex:1;min-width:110px"><button id="tg">Yoq/o‘ch</button></div>
<div class="row"><button class="d" id="sc">Qisqa tutashuv</button><button class="d" id="lk">Yer oqishi</button><button id="ts">UZO TEST</button><button id="rs">Hammasini yoqish</button></div></section>
<section id="p3" hidden><ul id="st"></ul></section>
</div>
<script>
var G=[],i,sel=0,wires=[],wc='w',wsel=null,V=220,msg='',chk=null,main={on:true},uzo={on:true,trip:false};
for(i=0;i<13;i++)G.push({n:'G'+(i+1),on:true,trip:false,nl:true,er:true});

function ty(id){return /^(kb_L|rt_L|rb_L|ut_L|ub_L|GA|GB)$/.test(id)?'faza':/_N$|^NB$/.test(id)?'nol':'yer'}

var s={};

s+='<rect x="'+lx+'" y="'+sy+'" width="'+lw+'" height="'+sh+'" rx="3" fill="#b9b7ad"/><rect x="'+(lx+1)+'" y="'+(on?sy+1:sy+sh*.5)+'" width="'+(lw-2)+'" height="'+(sh*.5-1)+'" rx="2.5" fill="'+(on?'url(#lv)':'#7d8794')+'"/><rect x="'+(lx+3)+'" y="'+(on?sy+3:sy+sh*.5+2)+'" width="'+(lw-6)+'" height="1.5" rx=".7" fill="#fff" opacity=".5"/>'}

function scr(x,y,r){r=r||5;return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#c9c7be" stroke="#6b6a65" stroke-width=".8"/><circle cx="'+x+'" cy="'+y+'" r="'+(r*.4)+'" fill="#a5a39a"/><line x1="'+(x-r*.7)+'" y1="'+(y-.5)+'" x2="'+(x+r*.7)+'" y2="'+(y+.5)+'" stroke="#55544f" stroke-width="1.1"/>'}

function di(id){return id[0]=='k'?0:id[0]=='r'?1:2}
function route(a,b){
var A=N[a],B=N[b],t;
if(A[0]==B[0]||A[1]==B[1])return [[A[0],A[1]],[B[0],B[1]]];

var byp=Math.abs(di(a)-di(b))>1,isN=/_N$/.test(a),ln=[95,187][Math.min(di(a),di(b))]+(isN?(byp?6:2):(byp?-8:-4));

function draw(S){

+'<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f5f0"/><stop offset="1" stop-color="#d9d7ce"/></linearGradient>'
+'<linearGradient id="lv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a8fe0"/><stop offset="1" stop-color="#1a4a94"/></linearGradient>'
+'<linearGradient id="rl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3c7cc"/><stop offset=".5" stop-color="#9aa0a7"/><stop offset="1" stop-color="#7b8087"/></linearGradient>'
+'<linearGradient id="br" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3c26a"/><stop offset="1" stop-color="#a98122"/></linearGradient></defs>';
h+='<rect x="3" y="2" width="394" height="436" rx="10" fill="#dedcd4" stroke="#aeaca1" stroke-width="2"/><rect x="9" y="8" width="382" height="424" rx="6" fill="#efeee8" stroke="#c9c7bd"/>';
[[16,12],[384,12],[16,426],[384,426]].forEach(function(p){h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#bdbbb1" stroke="#8d8b84" stroke-width=".6"/>'});
[[8,57,266],[8,170,376],[8,314,376]].forEach(function(r){h+='<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="11" fill="url(#rl)" stroke="#6f737a" stroke-width=".5"/><line x1="'+(r[0]+4)+'" y1="'+(r[1]+5.5)+'" x2="'+(r[0]+r[2]-4)+'" y2="'+(r[1]+5.5)+'" stroke="#4d5056" stroke-width="2" stroke-dasharray="9 5"/>'});

h+='<g class="tg" data-m="1">'+brk(12,38,74,50,main.on,S.m?'#3B6D11':(S.short?'#A32D2D':'#8d8b84'),'Kirish 2P',2)+'</g>';

h+='<g class="tg" data-u="1">'+brk(196,38,74,50,uzoOk(),uzo.trip?'#A32D2D':(S.L.ut_L&&uzo.on?'#3B6D11':'#8d8b84'),'UZO 30 mA'+(uzo.trip?' !':''),2,'<rect x="215" y="68" width="36" height="6" rx="2" fill="#e8833a"/><text x="233" y="73" text-anchor="middle" font-size="5" fill="#fff">TEST</text>')+'</g>';
h+='<text class="lb" x="288" y="50">Ko‘k chiziq: nol simi,</text><text class="lb" x="288" y="60">yashil: yer simi.</text><text class="lb" x="288" y="70">Bosib uzib ko‘ring.</text>';
[31,68,123,160,215,252].forEach(function(x){h+=blk(x,30)+blk(x,96)});
h+='<rect x="12" y="122" width="364" height="8" rx="2" fill="url(#br)" stroke="#8a6d1f" stroke-width=".5"/><text x="150" y="128" font-size="6" fill="#3a2d00" text-anchor="middle">A grebenka (yuqori 5 ta guruh)</text>'+scr(335,126);
h+='<rect x="12" y="266" width="364" height="8" rx="2" fill="url(#br)" stroke="#8a6d1f" stroke-width=".5"/><text x="150" y="272" font-size="6" fill="#3a2d00" text-anchor="middle">B grebenka (pastki 8 ta guruh)</text>'+scr(335,270);
function bar(y,t,pe){return '<rect x="12" y="'+y+'" width="364" height="10" rx="2" fill="url(#br)" stroke="#8a6d1f" stroke-width=".5"/>'+(pe?'<rect x="12" y="'+(y+8)+'" width="364" height="2" fill="#3B6D11"/>':'')+'<text x="16" y="'+(y+8)+'" font-size="6.5" fill="#3a2d00" font-weight="700">'+t+'</text>'}
h+=bar(234,'N1 (nol)')+bar(246,'PE1 (yer)',1)+bar(378,'N shina (nol)')+bar(390,'PE shina (yer)',1)+scr(372,238)+scr(300,394)+scr(372,250,3)+scr(372,382,3)+scr(372,394,3);
h+=cab('M372,238 H384 V382 H372','#378ADD')+cab('M372,250 H388 V394 H372','#EAC635',1);
for(i=0;i<13;i++){var top=i<5,j=top?i:i-5,w=top?38:30,x=top?30+62*j:16+43*j,y=top?152:296,c=x+w/2,gs=S.g[i];
var colr=G[i].trip?'#A32D2D':gs.work?'#3B6D11':gs.dang?'#e8833a':'#8d8b84',tc=top?146:290,bc=top?207:351,py=top?224:368,nb=top?238:382,pb=top?250:394;
h+='<rect x="'+(c-3)+'" y="'+(top?130:274)+'" width="6" height="7" fill="#b58f2f"/>'+blk(c,tc)+blk(c,bc);
h+='<g class="tg" data-g="'+i+'">'+(sel==i?'<rect x="'+(x-4)+'" y="'+(y-4)+'" width="'+(w+8)+'" height="56" rx="5" fill="none" stroke="#185FA5" stroke-width="2" stroke-dasharray="4 3"/>':'')+brk(x,y,w,48,G[i].on,colr,i+1,1)+'</g>';
h+=cab('M'+(c-7)+','+py+' L'+c+','+(bc+9),'#f6f5f0');
var dn='M'+c+','+py+' V'+nb,de='M'+(c+7)+','+py+' V'+pb;
h+=G[i].nl?cab(dn,'#378ADD'):'<path d="M'+c+','+py+' V'+(py+6)+'" stroke="#378ADD" stroke-width="3"/><path d="M'+c+','+(nb-6)+' V'+nb+'" stroke="#378ADD" stroke-width="3" opacity=".35"/><text x="'+(c+4)+'" y="'+(py+12)+'" font-size="9" fill="#A32D2D" font-weight="700">×</text>';
h+=G[i].er?cab(de,'#EAC635',1):'<path d="M'+(c+7)+','+py+' V'+(py+6)+'" stroke="#EAC635" stroke-width="3"/><text x="'+(c+9)+'" y="'+(py+12)+'" font-size="9" fill="#A32D2D" font-weight="700">×</text>';
h+='<line class="tg" data-gn="'+i+'" x1="'+c+'" y1="'+py+'" x2="'+c+'" y2="'+nb+'" stroke="transparent" stroke-width="7"/><line class="tg" data-ge="'+i+'" x1="'+(c+7)+'" y1="'+py+'" x2="'+(c+7)+'" y2="'+pb+'" stroke="transparent" stroke-width="5"/>';
h+='<circle cx="'+(c-7)+'" cy="'+py+'" r="2.4" fill="#f6f5f0" stroke="#444" stroke-width=".8"/><circle cx="'+c+'" cy="'+py+'" r="2.4" fill="#378ADD" stroke="#444" stroke-width=".8"/><circle cx="'+(c+7)+'" cy="'+py+'" r="2.4" fill="#EAC635" stroke="#444" stroke-width=".8"/>';
h+='<text class="lb" x="'+c+'" y="'+(top?262:408)+'" text-anchor="middle">'+G[i].n.slice(0,7)+'</text>'}
h+='<circle cx="360" cy="424" r="7" fill="#8d8b84" stroke="#555"/><text class="lb" x="328" y="436" text-anchor="middle">tashqi yer</text>';
wires.forEach(function(w,k){h+='<g class="tg" data-w="'+k+'">'+wp(w)+'</g>'});
Object.keys(N).forEach(function(id){var p=N[id];h+=(wsel==id?'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="11" fill="none" stroke="#185FA5" stroke-width="2.5"/>':'')+'<circle class="tg" data-n="'+id+'" cx="'+p[0]+'" cy="'+p[1]+'" r="12" fill="transparent"/>'});

function names(a){return a.map(function(i){return G[i].n}).join(', ')}
function render(){

document.getElementById('vv').textContent=V;

else if(!main.on)L.push(['bad','Kirish avtomati o‘chiq.']);

G.forEach(function(g,i){var q=S.g[i];if(q.work)wk.push(i);if(q.dang)dg.push(i);if(!relayOk()&&q.live)by.push(i);if(!g.er)ne.push(i)});

tk.className=bad?'bad':'';tk.textContent=bad?bad[1]:(msg||'Rang tanlang, so‘ng ikkita klemmani bosing.');
document.getElementById('chip').textContent='Ishlayapti: '+wk.length+' / 13';
Array.prototype.forEach.call(document.querySelectorAll('#cb button'),function(b){b.className=b.dataset.c==wc?'on':''});

(function(){var h='';['w','b','y'].forEach(function(c){h+='<button data-c="'+c+'"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:'+WC[c]+';border:1px solid #555;margin-right:5px;vertical-align:-1px"></span>'+CN[c]+'</button>'});document.getElementById('cb').innerHTML=h})();

var S=sim(),o=[],al=req.concat([['GA','GB','w']]);
wires.forEach(function(w){var f=null;al.forEach(function(r){if(key(r[0],r[1])==key(w.a,w.b))f=r});
if(f){if(f[2]!=w.c)o.push(['bad','Rang xato: '+nm[w.a]+' — '+nm[w.b]+'. Bu yerga '+CN[f[2]]+' sim kerak.'])}
else if(ty(w.a)!=ty(w.b))o.push(['bad','XAVFLI: '+nm[w.a]+' ('+ty(w.a)+') va '+nm[w.b]+' ('+ty(w.b)+') ulangan: qisqa tutashuv!']);
else o.push(['bad','Noto‘g‘ri ulanish: '+nm[w.a]+' — '+nm[w.b]+'.'])});
req.forEach(function(r){if(!has(r[0],r[1])&&!(r[1]=='GB'&&has('GA','GB')))o.push(['bad','Yetishmayapti: '+nm[r[0]]+' — '+nm[r[1]]+'.'])});
var bR=[],bU=[];S.g.forEach(function(q,i){if(q.byR)bR.push(i);if(q.byU)bU.push(i)});
if(bR.length)o.push(['bad','Kuchlanish relesi chetlab o‘tilgan: '+names(bR)+'. Faza rele orqali o‘tishi kerak.']);
if(bU.length)o.push(['bad','UZO chetlab o‘tilgan: '+names(bU)+'. Bu guruhlar yer oqishidan himoyalanmagan.']);
if(!o.length)o.push(['good','Hamma ulanish to‘g‘ri, rele va UZO hamma guruhlarni himoyalaydi.']);
chk=o;render();tab(3)}
function nmz(){return G[sel].n+' (№'+(sel+1)+')'}
function reset(){main.on=true;uzo={on:true,trip:false};G.forEach(function(g){g.on=true;g.trip=false;g.nl=true;g.er=true})}
function load(bypass){
wires=[];
req.forEach(function(r,k){if(bypass&&k<4)return;wires.push({a:r[0],b:r[1],c:r[2]})});
if(bypass)wires.push({a:'kb_L',b:'ut_L',c:'w'},{a:'kb_N',b:'ut_N',c:'b'});
reset();chk=null;msg='';wsel=null;render()}
document.getElementById('sv').addEventListener('click',function(e){
var t=e.target.closest('[data-n]');
if(t){var id=t.dataset.n;if(wsel===null)wsel=id;else if(wsel==id)wsel=null;else{if(!has(wsel,id))wires.push({a:wsel,b:id,c:wc});wsel=null;chk=null}render();return}
var w=e.target.closest('[data-w]');if(w){wires.splice(+w.dataset.w,1);chk=null;render();return}
var gn=e.target.closest('[data-gn]');if(gn){var a=+gn.dataset.gn;sel=a;G[a].nl=!G[a].nl;msg=G[a].n+': nol simi '+(G[a].nl?'ulandi.':'uzildi.');render();return}
var ge=e.target.closest('[data-ge]');if(ge){var b=+ge.dataset.ge;sel=b;G[b].er=!G[b].er;msg=G[b].n+': yer simi '+(G[b].er?'ulandi.':'uzildi.');render();return}
var g=e.target.closest('[data-g]');if(g){sel=+g.dataset.g;msg='';render();return}
if(e.target.closest('[data-m]')){main.on=!main.on;msg='';render();return}
if(e.target.closest('[data-u]')){if(uzo.trip){uzo.trip=false;uzo.on=true}else uzo.on=!uzo.on;msg='';render()}});
document.querySelector('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)tab(b.dataset.t)});
document.getElementById('tk').onclick=function(){tab(3)};
document.getElementById('cb').addEventListener('click',function(e){var b=e.target.closest('button');if(b){wc=b.dataset.c;wsel=null;render()}});
document.getElementById('vr').oninput=function(e){V=+e.target.value;msg='';render()};
document.getElementById('rn').oninput=function(e){G[sel].n=e.target.value||('G'+(sel+1));document.getElementById('sv').innerHTML=draw(sim())};
document.getElementById('un').onclick=function(){wires.pop();chk=null;render()};
document.getElementById('cl').onclick=function(){wires=[];wsel=null;chk=null;render()};
document.getElementById('ck').onclick=check;
document.getElementById('ok1').onclick=function(){load(false)};
document.getElementById('by1').onclick=function(){load(true)};
document.getElementById('tg').onclick=function(){G[sel].trip=false;G[sel].on=!G[sel].on;msg=nmz()+' avtomati '+(G[sel].on?'yoqildi.':'o‘chirildi.');render()};
document.getElementById('sc').onclick=function(){var q=sim().g[sel];
if(q.live){G[sel].on=false;G[sel].trip=true;msg='Qisqa tutashuv: '+nmz()+' avtomati ishladi, boshqa guruhlar ishlayapti.'}
else msg=nmz()+' guruhida kuchlanish yo‘q, sinov mumkin emas.';render()};
document.getElementById('lk').onclick=function(){var q=sim().g[sel];
if(!q.live)msg=nmz()+' guruhida kuchlanish yo‘q, sinov mumkin emas.';
else if(!q.byU){uzo.trip=true;msg='Yer oqishi: UZO ishladi va undan o‘tuvchi hamma guruhlar o‘chdi.'}
else msg='XAVFLI: UZO ishlamadi, chunki '+nmz()+' UZO orqali ulanmagan. Tok urishi mumkin.';render()};
document.getElementById('ts').onclick=function(){if(sim().L.ut_L&&uzoOk()){uzo.trip=true;msg='TEST: UZO ishladi, demak sog‘.'}else msg='Avval sxemani ulang va kuchlanish UZO gacha yetib borsin.';render()};
document.getElementById('rs').onclick=function(){reset();msg='Hammasi yoqildi va simlar tiklandi.';render()};
render();
</script></body></html>
